name: Deploy to PROD
on:
  workflow_dispatch:
    inputs:
      gitRef:
        description: 'Branch to deploy should be main'
        required: true
        default: 'main'
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: build code
        run: npm run build
      - name: fake deploy project
        run: echo "Deploying to PROD..."
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
