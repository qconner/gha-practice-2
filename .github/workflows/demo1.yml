name: Events Demo 1
on:
  workflow_dispatch:
    branches:
      - '**'
  push:
    branches:
      - '**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: lint code
        run: npm run lint
      - name: run tests
        run: npm run test
      - name: build code
        run: npm run build
